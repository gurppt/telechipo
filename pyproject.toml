[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telechipo"
version = "0.2.0"
description = "Compact GTK controller for Android devices via adb and scrcpy"
requires-python = ">=3.10"

[project.scripts]
telechipo = "salsilink_control.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
